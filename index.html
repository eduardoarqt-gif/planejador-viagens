<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#EFEEEA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dudoo Trips">
  <meta name="description" content="Planejamento de roteiros, cenários e custos de viagens.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css?v=42">
  <title>Dudoo Trips</title>
<script>
/* Sem zoom por duplo toque (17/10/2026): o iOS ignora user-scalable, então segura o 2º toque em áreas que não são botão/campo. */
(function () {
  var ultimo = 0;
  document.addEventListener("touchend", function (e) {
    var t = Date.now();
    if (t - ultimo < 350 && !(e.target.closest && e.target.closest("button,a,input,textarea,select,label,summary,[data-acao],[role=button]"))) e.preventDefault();
    ultimo = t;
  }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
})();
</script>
</head>
<body>
  <div id="app"></div>
  <dialog id="sheet"><form method="dialog" id="sheetForm"></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="mascaras.js?v=42"></script>
  <script type="module" src="app.js?v=42"></script>
</body>
</html>
